<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1150" viewBox="0 0 1450 1150" font-family="Helvetica, Arial, sans-serif">
  <rect width="1450" height="1150" fill="#ffffff"/>

  <!-- instructeursscherm: staat buiten de koffer, net als de externe monitor -->
  <rect x="20" y="10" width="160" height="820" fill="#5B21D6" stroke="#5B21D6"/>
  <text x="100" y="380" text-anchor="middle" font-size="26" fill="#ffffff">informatie</text>
  <text x="100" y="415" text-anchor="middle" font-size="26" fill="#ffffff">scherm</text>
  <text x="100" y="450" text-anchor="middle" font-size="26" fill="#ffffff">instructeur</text>
  <text x="100" y="500" text-anchor="middle" font-size="19" fill="#d9ccf7">canvas.py</text>

  <!-- de koffer -->
  <rect x="350" y="10" width="1080" height="1130" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="18 14"/>

  <!-- monteursscherm -->
  <rect x="380" y="55" width="1020" height="130" fill="#FDF3D0" stroke="#D4A94A" stroke-width="2"/>
  <text x="890" y="110" text-anchor="middle" font-size="27">informatie scherm monteur</text>
  <text x="890" y="148" text-anchor="middle" font-size="20" fill="#7a6a3a">monteur.py</text>

  <!-- applicatie -->
  <rect x="690" y="235" width="400" height="140" fill="#E2D9EC" stroke="#8E6FAE" stroke-width="2"/>
  <text x="890" y="292" text-anchor="middle" font-size="27">Applicatie</text>
  <text x="890" y="330" text-anchor="middle" font-size="20" fill="#5d4a73">main.py</text>

  <!-- simulatie -->
  <rect x="560" y="420" width="660" height="140" fill="#E2D9EC" stroke="#8E6FAE" stroke-width="2"/>
  <text x="890" y="477" text-anchor="middle" font-size="27">Simulatie van de schakeling</text>
  <text x="890" y="515" text-anchor="middle" font-size="20" fill="#5d4a73">simulator.py · models.py · draw.py</text>

  <!-- koppeling: verdeelt de simulatie over de kanalen, zoals de voedingsbeveiliging de spanning -->
  <rect x="380" y="605" width="1020" height="130" fill="#DCE6F8" stroke="#6A8FD4" stroke-width="2"/>
  <text x="890" y="660" text-anchor="middle" font-size="27">Koppeling met de koffer</text>
  <text x="890" y="698" text-anchor="middle" font-size="20" fill="#3f5c8f">S1-S8 · Q1-Q8 · D1-D55 · U1-U8</text>

  <!-- aansturing per printplaat -->
  <rect x="380" y="790" width="300" height="230" fill="#D9E8D4" stroke="#6AA05A" stroke-width="2"/>
  <text x="530" y="862" text-anchor="middle" font-size="24">48V-uitgangen</text>
  <text x="530" y="898" text-anchor="middle" font-size="20" fill="#4a7040">D1 tot en met D55</text>
  <text x="530" y="948" text-anchor="middle" font-size="19" fill="#4a7040">koffer_digitaal.py</text>

  <rect x="720" y="790" width="300" height="230" fill="#FBE3C4" stroke="#D99A3E" stroke-width="2"/>
  <text x="870" y="862" text-anchor="middle" font-size="24">Spanningsklemmen</text>
  <text x="870" y="898" text-anchor="middle" font-size="20" fill="#946523">U1 tot en met U8</text>
  <text x="870" y="948" text-anchor="middle" font-size="19" fill="#946523">koffer_dac.py</text>

  <rect x="1060" y="790" width="340" height="230" fill="#EFD2D4" stroke="#B5616B" stroke-width="2"/>
  <text x="1230" y="862" text-anchor="middle" font-size="24">Knoppen en lampen</text>
  <text x="1230" y="898" text-anchor="middle" font-size="20" fill="#8c4650">S1-S8 · Q1-Q8</text>
  <text x="1230" y="948" text-anchor="middle" font-size="19" fill="#8c4650">koffer_io.py</text>

  <!-- opgeslagen schakelingen -->
  <rect x="380" y="1050" width="500" height="70" fill="#E8E8E8" stroke="#8A8A8A" stroke-width="2"/>
  <text x="630" y="1095" text-anchor="middle" font-size="22">Opgeslagen schakelingen · circuits/*.json</text>
</svg>
